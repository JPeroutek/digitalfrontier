plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = 'Curse Maven'
		url = "https://cursemaven.com"
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz"
		content {
			includeGroup "xyz.nucleoid"
		}
	}
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me"
		content {
			includeGroup "me.shedaniel"
			includeGroup "me.shedaniel.cloth"
			includeGroup "dev.architectury"
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/digitalfrontier.accesswidener")
    splitEnvironmentSourceSets()

	mods {
		"digitalfrontier" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation("com.terraformersmc:modmenu:${project.modmenu_version}")

	// Runtime worlds for tuned grids; bundled in the jar so players don't install it separately
	implementation include("xyz.nucleoid:fantasy:${project.fantasy_version}")

	// Optional integrations: compiled against, never required at runtime (see compat/ModCompat)
	compileOnly("maven.modrinth:trinkets-updated:${project.trinkets_version}") {
		transitive = false
	}
	// Its events are yumi-commons ones, nested in its jar and published to Maven Central
	compileOnly "dev.yumi.commons:yumi-commons-event:2.0.0"

	// For testing purposes...
	// Release jar from Modrinth bundles worldedit-core; the EngineHub SNAPSHOTs drift out of sync with each other
	localRuntime "maven.modrinth:worldedit:7.4.3"
	// Maps (handy for checking grid layouts), block/entity tooltips, and recipe/item lookup
	localRuntime "maven.modrinth:xaeros-minimap:fabric-26.1.2-26.6.2"
	localRuntime "maven.modrinth:xaeros-world-map:fabric-26.1.2-1.47.2"
	localRuntime "maven.modrinth:jade:26.1.11+fabric"
	// REI, chosen when neither JEI nor EMI had a Fabric build (EMI still has none for 26.1.2); from its own maven, which brings its dependencies
	localRuntime "me.shedaniel:RoughlyEnoughItems-fabric:26.1.819"
	// Sodium for frame rate
	localRuntime "maven.modrinth:sodium:mc26.1.2-0.9.2-fabric"
	// Trinkets Updated, to try the kept-trinkets integration
	localRuntime "maven.modrinth:trinkets-updated:${project.trinkets_version}"
	// Distant Horizons and Chunky crash together (DH calls into Chunky before Chunky has started), so it's one or the
	// other: Distant Horizons to see far out (the derelict sectors from the city), or with -Ppregen, Chunky to
	// pregenerate chunks, e.g. /chunky world digitalfrontier:default, /chunky radius 3000, /chunky start.
	// Both by version id: DH 3.3.3-26.1.2; Chunky 1.5.3, a number its Fabric, Forge and NeoForge builds share
	if (project.hasProperty("pregen")) {
		localRuntime "maven.modrinth:chunky:4Eotm6ov"
	} else {
		localRuntime "maven.modrinth:distanthorizons:QHxoccsN"
	}

	// Runs JUnit tests inside Fabric Loader so Minecraft classes are available
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	//withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}